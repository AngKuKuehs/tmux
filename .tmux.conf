unbind r
bind r source-file ~/.tmux.conf

set -g prefix M-Space

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Hide the bottom pane (from ANY pane, without moving focus)
bind h run "tmux break-pane"

# Horizontal pane resizing (prefix + H/L)
bind -r H resize-pane -L 1   # shrink left
bind -r L resize-pane -R 1   # expand right

# Show the hidden pane (always the newest window created by break-pane)
bind s join-pane -s !

# Let nvim set cursor colour/shape and use truecolor through tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -ga terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

