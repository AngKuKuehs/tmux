unbind r
bind r source-file ~/.tmux.conf

set -g prefix M-Space

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Hide the bottom pane (from ANY pane, without moving focus)
bind h run "tmux break-pane"

# Horizontal pane resizing (prefix + H/L)
bind -r H resize-pane -L 1   # shrink left
bind -r L resize-pane -R 1   # expand right

# Show the hidden pane (always the newest window created by break-pane)
bind s join-pane -s !

# Let nvim set cursor colour/shape and use truecolor through tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -ga terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Blank out dracula's left smiley icon (a single space; empty values fall back to the default)
set -g @dracula-show-left-icon " "
set -g @dracula-left-icon-padding 0

# Kanagawa (Wave) palette for dracula/tmux, overriding its default colours
set -g @dracula-colors " white='#DCD7BA' gray='#2A2A37' dark_gray='#1F1F28' light_purple='#957FB8' dark_purple='#223249' cyan='#7FB4CA' green='#98BB6C' orange='#FFA066' red='#E82424' pink='#D27E99' yellow='#E6C384' "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

